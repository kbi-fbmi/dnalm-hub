[project]
name = "genomic-mcp-client"
version = "0.1.0"
description = "Stdlib-only generic MCP client base class shared by every genomic-mcp-* server's Python client."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genomic_mcp_client"]
