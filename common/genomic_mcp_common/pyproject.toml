[project]
name = "genomic-mcp-common"
version = "0.1.0"
description = "Shared device/dtype selection, model caching, HTTP/auth, and tokenization helpers for the genomic MCP server family (ntv3-mcp and siblings)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "mcp[cli]>=2.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genomic_mcp_common"]
