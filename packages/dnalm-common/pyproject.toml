[project]
name = "dnalm-common"
version = "0.1.0"
description = "Shared device/dtype selection, model caching, HTTP/auth, and tokenization helpers for the genomic MCP server family (ntv3-mcp and siblings)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "mcp[cli]>=2.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dnalm_common"]

# Tests run on CPU: use the small CPU torch wheel on Linux instead of the
# multi-GB CUDA one (same override as the services).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
