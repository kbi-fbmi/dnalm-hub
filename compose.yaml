# dnalm-hub GPU deployment: one container per model family. From the repo root:
#
#   docker compose up -d --build     start / update everything
#   docker compose ps                status
#   docker compose logs -f ntv2      logs of one service
#   docker compose down              stop
#
# Secrets come from .env next to this file (see .env.example); every service uses
# the same MCP_AUTH_TOKEN. To add a model family, copy one of the model blocks below
# and add it to the gateway's GATEWAY_BACKENDS.
#
# The gateway (port 8080) is an OpenAI-compatible /v1/embeddings API over all model
# services: model "ntv3/100m-pre", "ntv2/500m", ... (see services/gateway).
#
# Model weights live on the host in MODELS_DIR (default ./models), shared by all
# services as their HuggingFace cache. Create it before the first start:  mkdir -p models
# The containers run as MODELS_UID:MODELS_GID (default 1000:1000), which must be able
# to write there -- set them in .env to the directory owner (`id -u`, `id -g`).
name: dnalm-hub

x-service: &service
  gpus: all
  restart: unless-stopped
  user: "${MODELS_UID:-1000}:${MODELS_GID:-1000}"
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 60s
  volumes:
    # HuggingFace cache (HF_HOME) on the host. create_host_path: false makes a missing
    # directory an error instead of Docker creating it root-owned (not writable).
    - type: bind
      source: ${MODELS_DIR:-./models}
      target: /models
      bind:
        create_host_path: false

services:
  ntv3:
    <<: *service
    build:
      context: .
      dockerfile: services/ntv3/Dockerfile
    image: ntv3-mcp:gpu
    ports: ["8000:8000"]
    environment:
      # NTv3 checkpoints are gated: accept the license on HuggingFace first.
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN in .env -- see .env.example}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      NTV3_DTYPE: float32

  ntv2:
    <<: *service
    build:
      context: .
      dockerfile: services/ntv2/Dockerfile
    image: ntv2-mcp:gpu
    ports: ["8001:8000"]
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    image: dnalm-gateway:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      GATEWAY_BACKENDS: ntv3=http://ntv3:8000,ntv2=http://ntv2:8000
    depends_on: [ntv3, ntv2]
