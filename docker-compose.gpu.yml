services:
  ntv3-mcp:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: ntv3-mcp:gpu
    gpus: all
    ports:
      - "8000:8000"
    environment:
      # Required: accept each checkpoint's license on HuggingFace, then set a
      # token here. See README.md "Getting access to the model weights".
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN in a .env file or your shell -- see README "Getting access"}
      # Strongly recommended once this leaves localhost: shared-secret bearer
      # token required on the /mcp endpoint (see README "Securing the endpoint").
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      NTV3_DEVICE: cuda
      NTV3_DTYPE: bfloat16
    volumes:
      # Persist downloaded model weights across container restarts/recreations.
      - hf-cache:/home/appuser/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  hf-cache:
