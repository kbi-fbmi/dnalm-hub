# CPU-only variant (NTv3 only), for machines without an NVIDIA GPU. From the repo root:
#   docker compose -f compose.cpu.yaml up -d --build
name: dnalm-hub-cpu

services:
  ntv3:
    build:
      context: .
      dockerfile: services/ntv3/Dockerfile.cpu
    image: ntv3-mcp:cpu
    ports:
      - "8000:8000"
    environment:
      # Required: accept each checkpoint's license on HuggingFace, then set a
      # token here. See services/ntv3/README.md "Getting access to the model weights".
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN in a .env file or your shell -- see .env.example}
      # Strongly recommended once this leaves localhost: shared-secret bearer
      # token required on the /mcp endpoint (see services/ntv3/README.md "Securing the endpoint").
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      NTV3_DEVICE: cpu
      NTV3_DTYPE: float32
    volumes:
      # Persist downloaded model weights across container restarts/recreations.
      - hf-cache:/home/appuser/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  hf-cache:
