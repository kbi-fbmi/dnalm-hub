[project]
name = "grover-mcp"
version = "0.1.0"
description = "MCP server exposing PoetschLab's GROVER human-genome DNA language model (BPE masked LM): DNA embeddings and zero-shot variant scoring."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Radim Krupička" }]
dependencies = [
    "mcp[cli]>=2.0.0",
    # GROVER is a stock BertForMaskedLM + a tokenizers-library BPE tokenizer.json,
    # so no trust_remote_code and no upper bound: runs on transformers 5.x (like ntv3-mcp).
    "transformers>=5.0",
    # >=2.6: transformers refuses torch.load of .bin weights on older torch, and
    # PoetschLab/GROVER ships only pytorch_model.bin.
    "torch>=2.6",
    "numpy>=1.26",
    "dnalm-common",
]

[project.scripts]
grover-mcp = "grover_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grover_mcp"]

[dependency-groups]
dev = ["pytest>=8.0"]

# CPU torch wheel on Linux for local dev/tests; the GPU Dockerfile drops this
# override with --no-sources-package torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
dnalm-common = { path = "../../packages/dnalm-common", editable = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
