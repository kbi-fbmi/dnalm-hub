[project]
name = "hyenadna-mcp"
version = "0.9.0"
description = "MCP server exposing HazyResearch's HyenaDNA long-context causal DNA language models: embeddings, zero-shot variant scoring and sequence generation."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.0.0",
    # HyenaDNA's trust_remote_code (pinned revisions) loads and gives bit-identical
    # outputs on 4.57.6 and 5.18.0; 5.x is what was smoke-tested on the GPU. <6
    # because the remote code relies on PreTrainedModel/PreTrainedTokenizer internals.
    "transformers>=4.57,<6",
    "torch>=2.6",
    "numpy>=1.26",
    "dnalm-common",
]

[project.scripts]
hyenadna-mcp = "hyenadna_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyenadna_mcp"]

[dependency-groups]
dev = ["pytest>=8.0"]

# CPU torch wheel on Linux for local dev/tests; the GPU Dockerfile drops this
# override with --no-sources-package torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
dnalm-common = { path = "../../packages/dnalm-common", editable = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
