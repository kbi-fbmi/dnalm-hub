[project]
name = "genalm-mcp"
version = "0.9.0"
description = "MCP server exposing AIRI Institute's GENA-LM masked DNA language models (BPE tokenizer): DNA embeddings and zero-shot variant scoring."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Radim Krupička" }]
dependencies = [
    "mcp[cli]>=2.0.0",
    # GENA-LM's trust_remote_code modeling_bert.py (transformers-4.6-era code)
    # imports transformers.pytorch_utils.find_pruneable_heads_and_indices and
    # transformers.file_utils, both gone in 5.x -- same constraint as ntv2-mcp.
    # The bigbird checkpoint uses transformers' own BigBirdForMaskedLM instead.
    "transformers>=4.57,<5",
    # >=2.6: transformers refuses torch.load of .bin weights on older torch, and
    # bert-base-t2t-multi, bert-base-lastln-t2t and bigbird-base-t2t ship only
    # pytorch_model.bin.
    "torch>=2.6",
    "numpy>=1.26",
    "dnalm-common",
]

[project.scripts]
genalm-mcp = "genalm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genalm_mcp"]

[dependency-groups]
dev = ["pytest>=8.0"]

# CPU torch wheel on Linux for local dev/tests; the GPU Dockerfile drops this
# override with --no-sources-package torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
dnalm-common = { path = "../../packages/dnalm-common", editable = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
