[project]
name = "dnalm-gateway"
version = "0.1.0"
description = "OpenAI-compatible /v1/embeddings API that routes to every dnalm-hub model service."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Radim Krupička" }]
dependencies = [
    "starlette>=0.40",
    "uvicorn>=0.30",
    "dnalm-client",
]

[project.scripts]
dnalm-gateway = "dnalm_gateway.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dnalm_gateway"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "openai>=1.40"]

[tool.uv.sources]
dnalm-client = { path = "../../packages/dnalm-client", editable = true }
